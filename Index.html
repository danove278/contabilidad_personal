    function renderDeudaCard(d) {
      var item = document.createElement('div');
      item.className = 'deuda-item' + (d.activa ? '' : ' inactiva');
      item.dataset.desc = d.descripcion;

      var header = document.createElement('div');
      header.className = 'deuda-header';
      var title = document.createElement('div');
      title.className = 'deuda-title';
      title.textContent = d.descripcion;
      if (!d.activa) {
        var badge = document.createElement('span');
        badge.className = 'deuda-title-inactive-badge';
        badge.textContent = 'Inactiva';
        title.appendChild(badge);
      }
      header.appendChild(title);

      var actions = document.createElement('div');
      actions.className = 'config-item-actions';

      var btnEdit = document.createElement('button');
      btnEdit.className = 'config-edit-btn';
      btnEdit.innerHTML = '&#9998;';
      btnEdit.title = 'Editar';
      btnEdit.onclick = function() { abrirEdicionDeuda(d, item); };
      actions.appendChild(btnEdit);

      var btnDel = document.createElement('button');
      btnDel.className = 'config-delete-btn';
      btnDel.innerHTML = '&times;';
      btnDel.title = 'Eliminar';
      btnDel.onclick = function() { doEliminarDeuda(d.descripcion); };
      actions.appendChild(btnDel);
      header.appendChild(actions);

      item.appendChild(header);

      var pct = d.montoOriginal > 0 ? Math.min(100, Math.round((d.pagado / d.montoOriginal) * 100)) : 0;
      var progress = document.createElement('div');
      progress.className = 'deuda-progress';
      var bar = document.createElement('div');
      bar.className = 'deuda-progress-bar';
      bar.style.width = pct + '%';
      progress.appendChild(bar);
      item.appendChild(progress);

      var stats = document.createElement('div');
      stats.className = 'deuda-stats';
      var restante = document.createElement('span');
      restante.className = 'deuda-stats-restante';
      restante.textContent = 'Restante: ' + formatUSD(d.restante);
      var orig = document.createElement('span');
      orig.className = 'deuda-stats-orig';
      orig.textContent = pct + '% pagado · Original ' + formatUSD(d.montoOriginal);
      stats.appendChild(restante);
      stats.appendChild(orig);
      item.appendChild(stats);

      var meta = document.createElement('div');
      meta.className = 'deuda-meta';
      var metaHtml = 'Pago mensual: <strong>' + formatUSD(d.pagoMensual) + '</strong> · Día <strong>' + d.diaMes + '</strong>' +
        (d.ultimoPago ? ' · Último pago ' + d.ultimoPago : '');
      if (d.destinatario) {
        metaHtml += '<br><span style="color:var(--primary);">🔗 Vinculada a transferencia: <strong>' + d.destinatario + '</strong></span>';
      }
      meta.innerHTML = metaHtml;
      item.appendChild(meta);

      return item;
    }

    function formatUSD(n) {
      var num = parseFloat(n) || 0;
      return '$' + num.toLocaleString('es', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function abrirEdicionDeuda(d, cardEl) {
      var backup = cardEl.innerHTML;
      var backupClass = cardEl.className;
      cardEl.innerHTML = '';
      cardEl.className = 'deuda-edit-form';

      var titleRow = document.createElement('div');
      titleRow.style.fontWeight = '700';
      titleRow.style.marginBottom = '10px';
      titleRow.textContent = 'Editar: ' + d.descripcion;
      cardEl.appendChild(titleRow);

      var row = document.createElement('div');
      row.className = 'deuda-edit-row';

      var inpMonto = document.createElement('input');
      inpMonto.type = 'number';
      inpMonto.value = d.montoOriginal;
      inpMonto.step = '0.01';
      inpMonto.placeholder = 'Monto total';
      row.appendChild(inpMonto);

      var inpMens = document.createElement('input');
      inpMens.type = 'number';
      inpMens.value = d.pagoMensual;
      inpMens.step = '0.01';
      inpMens.placeholder = 'Pago mensual';
      row.appendChild(inpMens);

      var inpDia = document.createElement('input');
      inpDia.type = 'number';
      inpDia.value = d.diaMes;
      inpDia.min = '1';
      inpDia.max = '28';
      inpDia.placeholder = 'Día';
      row.appendChild(inpDia);
      cardEl.appendChild(row);

      var inpDest = document.createElement('input');
      inpDest.type = 'text';
      inpDest.value = d.destinatario || '';
      inpDest.placeholder = 'Destinatario Chase (opcional, ej: WF CREDIT CARD)';
      inpDest.style.marginTop = '8px';
      cardEl.appendChild(inpDest);

      var activaWrap = document.createElement('label');
      activaWrap.style.display = 'flex';
      activaWrap.style.alignItems = 'center';
      activaWrap.style.gap = '6px';
      activaWrap.style.marginTop = '8px';
      activaWrap.style.fontSize = '13px';
      var chkActiva = document.createElement('input');
      chkActiva.type = 'checkbox';
      chkActiva.checked = d.activa;
      chkActiva.style.width = 'auto';
      chkActiva.style.margin = '0';
      activaWrap.appendChild(chkActiva);
      activaWrap.appendChild(document.createTextNode('Deuda activa'));
      cardEl.appendChild(activaWrap);

      var actions = document.createElement('div');
      actions.className = 'deuda-edit-actions';
      var save = document.createElement('button');
      save.className = 'deuda-btn-save';
      save.textContent = 'Guardar';
      save.onclick = function() {
        doActualizarDeuda(
          d.descripcion,
          inpMonto.value,
          inpMens.value,
          inpDia.value,
          chkActiva.checked,
          inpDest.value
        );
      };
      var cancel = document.createElement('button');
      cancel.className = 'deuda-btn-cancel';
      cancel.textContent = 'Cancelar';
      cancel.onclick = function() {
        cardEl.className = backupClass;
        cardEl.innerHTML = backup;
        renderizarDeudas(); // reattach handlers
      };
      actions.appendChild(cancel);
      actions.appendChild(save);
      cardEl.appendChild(actions);
    }

    function doAgregarDeuda(inpDesc, inpMonto, inpMens, inpDia, inpDest) {
      var desc = (inpDesc.value || '').trim();
      var monto = parseFloat(inpMonto.value);
      var mens = parseFloat(inpMens.value);
      var dia = parseInt(inpDia.value, 10);
      var dest = inpDest ? (inpDest.value || '').trim() : '';
      if (!desc) { showToast('Falta descripción', 'error'); inpDesc.focus(); return; }
      if (!monto || monto <= 0) { showToast('Monto inválido', 'error'); inpMonto.focus(); return; }
      if (!mens || mens <= 0) { showToast('Pago mensual inválido', 'error'); inpMens.focus(); return; }
      if (!dia || dia < 1 || dia > 28) { showToast('Día del mes: 1-28', 'error'); inpDia.focus(); return; }

      if (previewLocal) {
        deudas.push({
          descripcion: desc, montoOriginal: monto, pagado: 0, restante: monto,
          pagoMensual: mens, diaMes: dia, activa: true, ultimoPago: '', destinatario: dest
        });
        renderizarDeudas();
        return;
      }

      google.script.run
        .withSuccessHandler(function(resp) {
          if (resp.success) {
            deudas = resp.deudas || deudas;
            renderizarDeudas();
            showToast('Deuda agregada', 'success');
          } else {
            showToast(resp.message, 'error');
          }
        })
        .withFailureHandler(function(err) { showToast('Error: ' + err.message, 'error'); })
        .agregarDeuda(desc, monto, mens, dia, dest);
    }

    function doActualizarDeuda(desc, monto, mens, dia, activa, destinatario) {
      var dest = (destinatario || '').trim();
      if (previewLocal) {
        for (var i = 0; i < deudas.length; i++) {
          if (deudas[i].descripcion === desc) {
            deudas[i].montoOriginal = parseFloat(monto);
            deudas[i].restante = deudas[i].montoOriginal - deudas[i].pagado;
            deudas[i].pagoMensual = parseFloat(mens);
            deudas[i].diaMes = parseInt(dia, 10);
            deudas[i].activa = !!activa;
            deudas[i].destinatario = dest;
            break;
          }
        }
        renderizarDeudas();
        return;
      }

      google.script.run
        .withSuccessHandler(function(resp) {
          if (resp.success) {
            deudas = resp.deudas || deudas;
            renderizarDeudas();
            showToast(resp.message, 'success');
          } else {
            showToast(resp.message, 'error');
          }
        })
        .withFailureHandler(function(err) { showToast('Error: ' + err.message, 'error'); })
        .actualizarDeuda(desc, monto, mens, dia, activa, dest);
    }

    function doEliminarDeuda(desc) {
      if (!confirm('¿Eliminar la deuda "' + desc + '"?\n\nEsto NO borra los pagos históricos ya registrados en Movimientos.')) return;

      if (previewLocal) {
        deudas = deudas.filter(function(d) { return d.descripcion !== desc; });
        renderizarDeudas();
        return;
      }

      google.script.run
        .withSuccessHandler(function(resp) {
          if (resp.success) {
            deudas = resp.deudas || deudas;
            renderizarDeudas();
            showToast('Deuda eliminada', 'success');
          } else {
            showToast(resp.message, 'error');
          }
        })
        .withFailureHandler(function(err) { showToast('Error: ' + err.message, 'error'); })
        .eliminarDeuda(desc);
    }

    /* ============================================================
       TAB: 4 PAGOS (setup detectados, pendientes de confirmar)
       ============================================================ */

    function renderizarPagos4() {
      var body = document.getElementById('tabPagos4');
      body.innerHTML = '';

      var hint = document.createElement('div');
      hint.className = 'tab-hint';
      hint.innerHTML = 'Cuando Chase detecta que configuraste 4 Pagos, aparece aquí. Confirma qué movimiento se convirtió — la app lo borra para evitar doble contabilización. Los 4 cobros futuros de Chase llegan como transacciones normales.';
      body.appendChild(hint);

      if (pagos4Pendientes.length === 0) {
        var vacio = document.createElement('div');
        vacio.className = 'config-empty';
        vacio.textContent = 'No hay planes 4 Pagos pendientes.';
        body.appendChild(vacio);
        return;
      }

      pagos4Pendientes.forEach(function(p) {
        body.appendChild(renderPago4Card(p));
      });
    }

    function renderPago4Card(p) {
      var item = document.createElement('div');
      item.className = 'deuda-item';
      item.style.borderLeftColor = '#8e44ad';

      var header = document.createElement('div');
      header.className = 'deuda-header';
      var title = document.createElement('div');
      title.className = 'deuda-title';
      title.textContent = p.comercio || '(sin comercio)';
      header.appendChild(title);
      item.appendChild(header);

      var meta = document.createElement('div');
      meta.className = 'deuda-meta';
      meta.style.marginBottom = '10px';
      meta.innerHTML =
        'Plan <strong>···' + p.numeroPlan + '</strong> · Total <strong>' + formatUSD(p.montoTotal) + '</strong> · ' +
        '4 × ' + formatUSD(p.cuota) +
        ' · Cuenta ···' + p.cuentaOrigen +
        (p.fechaPrimerPago ? '<br>Primer pago: ' + p.fechaPrimerPago : '');
      item.appendChild(meta);

      // Loading state para el dropdown
      var selWrap = document.createElement('div');
      selWrap.style.marginBottom = '8px';
      var label = document.createElement('label');
      label.style.fontSize = '12px';
      label.style.fontWeight = '600';
      label.style.color = 'var(--text-light)';
      label.style.textTransform = 'uppercase';
      label.style.letterSpacing = '0.5px';
      label.style.display = 'block';
      label.style.marginBottom = '4px';
      label.textContent = 'Movimiento que se convirtió a 4 Pagos';
      selWrap.appendChild(label);

      var select = document.createElement('select');
      select.className = 'pago4-select';
      select.style.width = '100%';
      select.style.padding = '10px';
      select.style.borderRadius = '8px';
      select.style.border = '2px solid var(--border)';
      select.style.fontSize = '13px';
      select.style.fontFamily = 'inherit';
      select.innerHTML = '<option value="">Cargando candidatos...</option>';
      select.disabled = true;
      selWrap.appendChild(select);
      item.appendChild(selWrap);

      var actions = document.createElement('div');
      actions.className = 'deuda-edit-actions';
      var btnIgn = document.createElement('button');
      btnIgn.className = 'deuda-btn-cancel';
      btnIgn.textContent = 'Ignorar';
      btnIgn.onclick = function() { doIgnorar4Pagos(p.numeroPlan); };
      var btnConf = document.createElement('button');
      btnConf.className = 'deuda-btn-save';
      btnConf.textContent = 'Anular movimiento';
      btnConf.disabled = true;
      btnConf.onclick = function() {
        var ts = parseFloat(select.value);
        if (!ts) { showToast('Selecciona un movimiento', 'error'); return; }
        doConfirmar4Pagos(p.numeroPlan, ts);
      };
      actions.appendChild(btnIgn);
      actions.appendChild(btnConf);
      item.appendChild(actions);

      // Cargar candidatos async
      if (previewLocal) {
        // preview: usar movimiento ficticio
        select.innerHTML = '<option value="1723800000000">15/08/2026 — AMAZON.COM ($99.00) — Gastos Variables/Compras generales</option>';
        select.disabled = false;
        btnConf.disabled = false;
      } else {
        google.script.run
          .withSuccessHandler(function(candidatos) {
            select.innerHTML = '';
            if (!candidatos || candidatos.length === 0) {
              select.innerHTML = '<option value="">No hay movimientos coincidentes en los últimos 45 días</option>';
              return;
            }
            var opt0 = document.createElement('option');
            opt0.value = '';
            opt0.textContent = '-- Elige el movimiento --';
            select.appendChild(opt0);
            candidatos.forEach(function(c) {
              var opt = document.createElement('option');
              opt.value = c.timestamp;
              opt.textContent = c.fecha + ' — ' + (c.descripcion || '(sin descr.)') +
                ' — ' + formatUSD(c.monto) + ' — ' + c.categoria + '/' + c.subcategoria;
              select.appendChild(opt);
            });
            select.disabled = false;
            select.onchange = function() { btnConf.disabled = !select.value; };
          })
          .withFailureHandler(function(err) {
            select.innerHTML = '<option value="">Error cargando candidatos</option>';
            console.error('candidatos:', err);
          })
          .obtenerCandidatos4Pagos(p.montoTotal);
      }

      return item;
    }

    function doConfirmar4Pagos(numeroPlan, timestampMillis) {
      if (previewLocal) {
        pagos4Pendientes = pagos4Pendientes.filter(function(x) { return x.numeroPlan !== numeroPlan; });
        pagos4Count = pagos4Pendientes.length;
        actualizarBadgePagos4();
        renderizarPagos4();
        showToast('Movimiento anulado (preview)', 'success');
        return;
      }
      google.script.run
        .withSuccessHandler(function(resp) {
          if (resp.success) {
            pagos4Pendientes = pagos4Pendientes.filter(function(x) { return x.numeroPlan !== numeroPlan; });
            pagos4Count = pagos4Pendientes.length;
            actualizarBadgePagos4();
            renderizarPagos4();
            showToast(resp.message, 'success');
          } else {
            showToast(resp.message, 'error');
          }
        })
        .withFailureHandler(function(err) { showToast('Error: ' + err.message, 'error'); })
        .confirmar4Pagos(numeroPlan, timestampMillis);
    }

    function doIgnorar4Pagos(numeroPlan) {
      if (!confirm('¿Ignorar este plan 4 Pagos? No se borrará ningún movimiento.')) return;
      if (previewLocal) {
        pagos4Pendientes = pagos4Pendientes.filter(function(x) { return x.numeroPlan !== numeroPlan; });
        pagos4Count = pagos4Pendientes.length;
        actualizarBadgePagos4();
        renderizarPagos4();
        return;
      }
      google.script.run
        .withSuccessHandler(function(resp) {
          if (resp.success) {
            pagos4Pendientes = pagos4Pendientes.filter(function(x) { return x.numeroPlan !== numeroPlan; });
            pagos4Count = pagos4Pendientes.length;
            actualizarBadgePagos4();
            renderizarPagos4();
            showToast(resp.message, 'success');
          } else {
            showToast(resp.message, 'error');
          }
        })
        .withFailureHandler(function(err) { showToast('Error: ' + err.message, 'error'); })
        .ignorar4Pagos(numeroPlan);
    }

    /* ============================================================
       TAB: EMAILS (autoregistro desde Chase)
       ============================================================ */

    function renderizarEmails() {
      var body = document.getElementById('tabEmails');
      body.innerHTML = '';

      var hint = document.createElement('div');
      hint.className = 'tab-hint';
      hint.innerHTML = 'El script solo lee emails con el label <code>Banco/Alertas</code>. Cualquier otro email es invisible para la app.';
      body.appendChild(hint);

      var status = document.createElement('div');
      status.className = 'emails-status';
      status.innerHTML =
        '<div class="emails-stat">' +
          '<div class="emails-stat-number ' + (pendientesCount > 0 ? 'warn' : '') + '" id="statPendientes">' + pendientesCount + '</div>' +
          '<div class="emails-stat-label">Pendientes</div>' +
        '</div>' +
        '<div class="emails-stat">' +
          '<div class="emails-stat-number">' + tarjetas.length + '</div>' +
          '<div class="emails-stat-label">Tarjetas</div>' +
        '</div>';
      body.appendChild(status);

      var btn = document.createElement('button');
      btn.className = 'btn-sync';
      btn.id = 'btnSync';
      btn.textContent = 'Sincronizar ahora';
      btn.onclick = doSincronizar;
      body.appendChild(btn);

      var help = document.createElement('div');
      help.className = 'emails-help';
      help.innerHTML =
        '<h4>Configuración inicial (una sola vez)</h4>' +
        '<ol>' +
          '<li>En Gmail crea el label <code>Banco/Alertas</code>.</li>' +
          '<li>Crea un filtro con <code>De: no.reply.alerts@chase.com</code> que aplique ese label.</li>' +
          '<li>En Apps Script ejecuta <code>crearTriggerEmails()</code> para que se sincronice cada 15 min automáticamente.</li>' +
        '</ol>' +
        '<div style="margin-top:8px;font-size:12px;color:var(--text-light);">Los pendientes se resuelven agregando el elemento o la tarjeta faltante en las otras pestañas — se registran solos.</div>';
      body.appendChild(help);
    }

    function doSincronizar() {
      var btn = document.getElementById('btnSync');
      btn.disabled = true;
      btn.classList.add('loading');

      if (previewLocal) {
        setTimeout(function() {
          btn.disabled = false;
          btn.classList.remove('loading');
          showToast('Preview local: no hay backend', 'error');
        }, 500);
        return;
      }

      google.script.run
        .withSuccessHandler(function(resp) {
          btn.disabled = false;
          btn.classList.remove('loading');
          if (resp.success) {
            pendientesCount = resp.pendientesRestantes || 0;
            actualizarBadgeEmails();
            // recargar 4 Pagos por si aparecieron nuevos
            google.script.run
              .withSuccessHandler(function(data) {
                pagos4Pendientes = data || [];
                pagos4Count = pagos4Pendientes.length;
                actualizarBadgePagos4();
                renderizarPagos4();
              })
              .obtener4PagosPendientes();
            renderizarEmails();
            switchTab('emails');
            showToast(resp.message, 'success');
          } else {
            showToast(resp.message, 'error');
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.classList.remove('loading');
          showToast('Error: ' + err.message, 'error');
        })
        .sincronizarAhora();
    }
  </script>
